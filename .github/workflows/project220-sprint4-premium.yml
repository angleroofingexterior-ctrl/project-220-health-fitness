name: Project 220 Sprint 4 Premium Operations

on:
  workflow_dispatch:
  push:
    branches:
      - sprint-4-premium-operations

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Sprint 4 Alpha
        run: npm run build:public

      - name: Verify premium modules
        run: |
          test -f public-pages/index.html
          grep -R "Premium Operations" public-pages
          grep -R "Professional Coach Marketplace" public-pages
          grep -R "Pharmacy Pickup Chain of Custody" public-pages
          grep -R "Retailer Integration Readiness" public-pages

      - name: Upload Sprint 4 Alpha
        uses: actions/upload-artifact@v4
        with:
          name: Project-220-Sprint-4-Premium-Operations-Alpha
          path: public-pages/
          if-no-files-found: error
          retention-days: 30
